<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Editores - Notitwitt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="imagen_circular_recortada.png" alt="Logo de Notitwitt">
                <h2>Notitwitt - Acceso restringido</h2>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">← Volver al inicio</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal" style="justify-content: center;">
        <div class="formulario-admin">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                <label>Correo de Editor:</label>
                <input type="email" id="email-login" required>

                <label>Contraseña:</label>
                <input type="password" id="password-login" required>

                <button type="submit" id="btn-login">Entrar</button>
            </form>
        </div>
    </main>

    <!-- Conectamos la lógica del login -->
    <script type="module" src="login.js"></script>
</body>
</html>
