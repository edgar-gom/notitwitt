<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Editor - Notitwitt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;"></body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="imagen_circular_recortada.png" alt="Logo de Notitwitt">
                <h2>Notitwitt - Editor</h2>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">← Volver al Sitio</a></li>
                <li><button id="btn-logout" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal" style="flex-direction: column; align-items: center;">
        
        <!-- Formulario -->
        <div class="formulario-admin" style="margin-bottom: 2rem;">
            <h2>Escribir Nueva Noticia</h2>
            <form id="form-noticia">
                <label>Título:</label>
                <input type="text" id="titulo" required>

                <label>Resumen Corto (Para la página principal):</label>
                <textarea id="resumen" rows="2" required></textarea>

                <label>Contenido Completo (Para leer la noticia):</label>
                <textarea id="contenido" rows="6" required></textarea>

                <label>Categoría:</label>
                <select id="categoria">
                    <option value="Política">Política</option>
                    <option value="Cultura">Cultura</option>
                    <option value="Entretenimiento">Entretenimiento</option>
                    <option value="Deporte">Deporte</option>
                    <option value="Local">Local</option>
                </select>

                <!-- CAMBIO AQUÍ: Imagen opcional y botón al lado -->
                <label>Enlace de la Imagen (Opcional):</label>
                                
                <label>Ejemplo: https://cdn-icons-png.flaticon.com/512/5360/5360938.png</label>

                <div style="display: flex; gap: 10px; align-items: center; margin-top: 0.5rem;">
                    
                    <!-- Le quitamos la palabra "required" para que sea opcional -->
                    <input type="url" id="imagen" placeholder="Pega el link aquí..." style="margin-top: 0;">
                    
                    <!-- Este es el nuevo botón que abre Postimages en otra pestaña -->
                    <a href="https://postimages.org/es/" target="_blank" style="background: #475569; color: white; padding: 0.8rem 1rem; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem; text-align: center; white-space: nowrap;">
                        Subir foto gratis ↗
                    </a>
                </div>  

                <div class="checkbox-container">
                    <input type="checkbox" id="es_opinion">
                    <label for="es_opinion">Es Columna de Opinión</label>
                </div>
                <button type="submit" id="btn-publicar">Publicar Noticia</button>
            </form>
        </div>

        <!-- Lista para borrar noticias -->
        <div class="formulario-admin">
            <h2>Administrar Noticias Publicadas</h2>
            <div id="lista-borrar-noticias" style="margin-top: 1rem;">
                <!-- Aquí JavaScript pondrá la lista -->
            </div>
        </div>

    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
