<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notitwitt - Artículo</title>
    <link rel="icon" href="imagen_circular_recortada.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="imagen_circular_recortada.png" alt="Logo de Notitwitt">
                <h1>Notitwitt</h1>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" style="color: var(--azul-acento);">← Inicio</a></li>
                <li><a href="#">Política</a></li>
                <li><a href="#">Cultura</a></li>
                <li><a href="#">Entretenimiento</a></li>
                <li><a href="#">Deporte</a></li>
                <li><a href="#">Local</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal" style="flex-direction: column; align-items: center;">
        <article class="tarjeta-noticia" id="contenedor-articulo" style="width: 100%; max-width: 800px; padding: 2rem;">
            <!-- Aquí JavaScript inyectará la noticia completa -->
            <h2 style="text-align: center;">Cargando noticia...</h2>
        </article>
        <!-- SECCIÓN DE COMENTARIOS -->
        <div style="width: 100%; max-width: 800px; margin-top: 2rem; background: var(--fondo-tarjetas); padding: 2rem; border-radius: 8px;">
            <h3 style="border-bottom: 1px solid #334155; padding-bottom: 10px;">Comentarios</h3>
            
            <form id="form-comentario" style="display: flex; flex-direction: column; gap: 10px; margin-top: 1rem;">
                <input type="text" id="nombre-comentario" placeholder="Tu nombre" required style="padding: 10px; border-radius: 4px; border: 1px solid #334155; background: var(--fondo-principal); color: white;">
                <textarea id="texto-comentario" placeholder="Escribe tu comentario..." rows="3" required style="padding: 10px; border-radius: 4px; border: 1px solid #334155; background: var(--fondo-principal); color: white;"></textarea>
                <button type="submit" style="background: var(--azul-acento); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; align-self: flex-start;">Publicar comentario</button>
            </form>

            <div id="lista-comentarios" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 15px;">
                <!-- Aquí aparecerán los comentarios -->
            </div>
        </div>
    </main>

    <script type="module" src="articulo.js"></script>
</body>
</html>
